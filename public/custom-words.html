<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מילים בהתאמה אישית</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="custom-words.css"></head><body><main><h1>📋 מילים בהתאמה אישית</h1><div id="count">0 / 500 מילים</div><nav><button data-tab="add" class="active">➕ הוספה</button><button data-tab="list">📚 המילים שלי</button><button data-tab="manage">⚙️ ניהול</button></nav><section id="add" class="tab"><textarea id="input" placeholder="מילה אחת, רשימה בשורות או מילים מופרדות בפסיקים"></textarea><button id="addBtn">הוסף מילים</button><p id="result"></p></section><section id="list" class="tab hidden"><input id="search" placeholder="חיפוש"><div id="words"></div><p id="playHint"></p><a id="playBtn" class="action hidden">⭐ שחק עם המאגר האישי</a></section><section id="manage" class="tab hidden"><button id="exportBtn">📤 ייצוא וגיבוי</button><button id="clearBtn" class="danger">🗑️ ניקוי המאגר</button></section></main><script src="custom-words.js"></script></body></html>
