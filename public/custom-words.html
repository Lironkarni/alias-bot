<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>המאגר האישי שלי</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="custom-words.css">
</head>
<body>
  <main class="custom-words-app">
    <header>
      <h1>📋 המאגר האישי שלי</h1>
      <p>בנה מאגר מילים משלך ושחק איתו בכל קבוצה</p>
    </header>

    <div class="counter-card">
      <strong id="count">0 / 500 מילים</strong>
      <span>צריך לפחות 60 מילים כדי לפתוח משחק</span>
    </div>

    <nav class="tabs" aria-label="ניווט במאגר">
      <button data-tab="add" class="tab active">➕ הוספה</button>
      <button data-tab="list" class="tab">📚 המילים שלי</button>
      <button data-tab="manage" class="tab">⚙️ ניהול</button>
    </nav>

    <section id="add" class="card">
      <h2>➕ הוספת מילים</h2>
      <label for="input">מילה אחת או רשימה שלמה</label>
      <textarea id="input" placeholder="כלב&#10;חתול&#10;מקרר&#10;&#10;אפשר גם להפריד מילים בפסיקים"></textarea>
      <p class="hint">כל מילה צריכה להכיל 2–30 תווים. אפשר להדביק רשימה שלמה בבת אחת.</p>
      <button id="addBtn" class="primary-button">הוסף למאגר</button>
      <p id="result" class="message"></p>
    </section>

    <section id="list" class="card hidden">
      <h2>📚 המילים שלי</h2>
      <input id="search" type="search" placeholder="🔎 חיפוש מילה">
      <div id="words" class="words-list"></div>
      <div class="play-section">
        <p id="playHint" class="hint"></p>
        <a id="playBtn" class="primary-button action hidden">⭐ שחק עם המאגר האישי</a>
      </div>
    </section>

    <section id="manage" class="card hidden">
      <h2>⚙️ ניהול המאגר</h2>
      <button id="exportBtn" class="secondary-button">📤 ייצוא וגיבוי</button>
      <p class="hint">הורדת כל המילים לקובץ טקסט.</p>
      <button id="clearBtn" class="danger-button">🗑️ ניקוי המאגר</button>
      <p class="hint">מחיקת כל המילים לאחר אישור.</p>
    </section>
  </main>

  <script src="custom-words.js"></script>
</body>
</html>
