name: Flatten word pools

on:
  push:
    branches:
      - agent/flatten-word-pools

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/flatten-word-pools
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/flattenWords.js
      - run: node --test words.test.js
      - name: Commit generated words.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add words.js
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Flatten word pools"
          git push
